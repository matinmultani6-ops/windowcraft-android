name: Build Android AAB

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.6'

    - name: Ensure Project Structure & Config Files
      run: |
        echo "sdk.dir=$ANDROID_HOME" > local.properties

        # Ensure settings.gradle exists with Google Repositories
        cat << 'EOF' > settings.gradle
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = "WindowCraft Pro"
        include ':app'
        EOF

        # Ensure root build.gradle exists
        cat << 'EOF' > build.gradle
        plugins {
            id 'com.android.application' version '8.4.0' apply false
        }
        EOF

        # Ensure Proguard file exists
        mkdir -p app
        touch app/proguard-rules.pro

        # Create executable Gradle wrapper
        gradle wrapper --gradle-version 8.6
        chmod +x gradlew

    - name: Build Android Bundle (AAB)
      run: |
        ./gradlew :app:bundleRelease --no-daemon --stacktrace

    - name: Sign AAB Bundle & Export Certificate
      run: |
        if [ ! -f release.keystore ]; then
          keytool -genkey -v -keystore release.keystore -alias windowcraft -keyalg RSA -keysize 2048 -validity 10000 -storepass windowcraft123 -keypass windowcraft123 -dname "CN=WindowCraft, OU=Dev, O=WindowCraftPro, L=IN, S=IN, C=IN"
        fi
        jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 -keystore release.keystore -storepass windowcraft123 -keypass windowcraft123 app/build/outputs/bundle/release/app-release.aab windowcraft
        
        # Export public certificate for Play Console upload key reset
        keytool -export -rfc -keystore release.keystore -alias windowcraft -file upload_certificate.pem -storepass windowcraft123

    - name: Upload Play Store AAB Package
      uses: actions/upload-artifact@v4
      with:
        name: WindowCraft-PlayStore-Package
        path: |
          app/build/outputs/bundle/release/app-release.aab
          upload_certificate.pem
